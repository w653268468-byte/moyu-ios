name: ShortDrama
options:
  bundleIdPrefix: org.open.shortdrama
targets:
  ShortDrama:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.open.shortdrama.app
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 看短剧
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
