name: Focused current source audit
on:
  push:
    branches: [codex/source-audit-focus]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Fetch independent public collections
        run: python3 scripts/fetch_source_corpus.py
      - name: Verify complex rules before reading websites
        run: swift test --filter 'ComplexSourceScriptTests|SourceRSATests|RuleCompositionTests|SourceClientTests' -Xcc "-I$(xcrun --show-sdk-path)/usr/include/libxml2"
      - name: Validate current maintained collection
        env:
          GAVIN_SOURCE_AUDIT: '1'
          GAVIN_AUDIT_LIMIT: '60'
          GAVIN_AUDIT_COLLECTION: 'cjj200011222/legado-booksource'
        run: swift test --filter SourceCorpusAuditTests -Xcc "-I$(xcrun --show-sdk-path)/usr/include/libxml2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gavin-current-source-audit
          path: |
            .build/source-audit/report.json
            .build/source-audit/provenance.json
