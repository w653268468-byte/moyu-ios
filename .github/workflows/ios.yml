name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate project files
        run: python3 scripts/validate.py
      - name: Test parser and source rules
        run: swift test --parallel
      - name: Build iOS Simulator
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for local signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Moyu.app build/package/Payload/
          cd build/package
          zip -qr ../Moyu-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moyu-iOS-unsigned
          path: build/Moyu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish rebuild preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package_source.py
          if gh release view v2.0.0-preview.1 >/dev/null 2>&1; then
            gh release upload v2.0.0-preview.1 build/Moyu-unsigned.ipa dist/Moyu-iOS-source.zip --clobber
          else
            gh release create v2.0.0-preview.1 build/Moyu-unsigned.ipa dist/Moyu-iOS-source.zip --target "$GITHUB_SHA" --prerelease --title "墨屿 2.0 重构预览" --notes-file docs/RELEASE_2.md
          fi
