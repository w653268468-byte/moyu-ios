name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate project files
        run: python3 scripts/validate.py
      - name: Test parser and source rules
        run: swift test --parallel
      - name: Build iOS Simulator
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for local signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Moyu.app build/package/Payload/
          cd build/package
          zip -qr ../Moyu-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moyu-iOS-unsigned
          path: build/Moyu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
