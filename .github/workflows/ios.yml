name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate project files
        run: python3 scripts/validate.py
      - name: Test parser and source rules
        run: swift test --parallel -Xcc "-I$(xcrun --show-sdk-path)/usr/include/libxml2"
      - name: Live public-domain source check
        continue-on-error: true
        env:
          MOYU_LIVE_CHECK: '1'
        run: swift test --filter LiveSourceTests -Xcc "-I$(xcrun --show-sdk-path)/usr/include/libxml2" 2>&1 | tee live-source-check.log
      - name: Upload live check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gavin-live-source-check
          path: live-source-check.log
          if-no-files-found: warn
      - name: Build iOS Simulator
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Capture simulator screens
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/Gavin.app
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" org.moyu.reader data)
          python3 scripts/seed_simulator.py "$CONTAINER"
          mkdir -p build/ui
          for TAB in 0 1 2 3; do
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.moyu.reader --ui-tab "$TAB"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "build/ui/tab-$TAB.png"
          done
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.moyu.reader --ui-tab 3 --ui-preferences
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/ui/reader-preferences.png
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.moyu.reader --ui-reading
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot build/ui/reading-fullscreen.png
          python3 scripts/web_login_fixture.py > build/web-login-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.moyu.reader --ui-cookie-check
          for ATTEMPT in $(seq 1 30); do
            if [ -f "$CONTAINER/Documents/cookie-check.json" ]; then break; fi
            sleep 1
          done
          python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); print(d); assert d["status"] == "passed"' "$CONTAINER/Documents/cookie-check.json"
          xcrun simctl terminate "$DEVICE_ID" org.moyu.reader
      - name: Upload simulator screens
        uses: actions/upload-artifact@v4
        with:
          name: Gavin-UI-preview
          path: build/ui/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Package IPA for local signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Gavin.app build/package/Payload/
          cd build/package
          zip -qr ../Gavin-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gavin-iOS-unsigned
          path: build/Gavin-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish rebuild preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package_source.py
          python3 -c 'import json,os,pathlib; pathlib.Path("build/build-info.json").write_text(json.dumps({"commit":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"],"version":"2.0.0","bundle":"org.moyu.reader"},indent=2))'
          shasum -a 256 build/Gavin-unsigned.ipa dist/Gavin-iOS-source.zip > build/SHA256SUMS.txt
          RELEASE_TAG="v2.0.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" build/Gavin-unsigned.ipa dist/Gavin-iOS-source.zip build/build-info.json build/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Gavin 2.0 重构预览 ${GITHUB_RUN_NUMBER}" --notes-file docs/RELEASE_2.md
